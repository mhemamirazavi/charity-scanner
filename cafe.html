<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ثبت سفارش کافه و رستوران</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; padding: 12px 12px 150px 12px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 480px; }

    header { text-align: center; margin-bottom: 14px; }
    h1 { color: #38bdf8; font-size: 1.25rem; font-weight: 900; }

    .search-input {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      background: #1e293b; border: 1.5px solid #334155; color: #fff;
      font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; outline: none;
    }
    .search-input:focus { border-color: #38bdf8; }

    .section-title { font-size: 0.95rem; color: #fbbf24; font-weight: 800; margin: 14px 0 10px; padding-bottom: 5px; border-bottom: 1px dashed #334155; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .menu-card {
      background: #1e293b; border: 1.5px solid #334155; border-radius: 14px;
      padding: 12px 6px; text-align: center; cursor: pointer; position: relative;
      transition: 0.15s; user-select: none; display: flex; flex-direction: column; justify-content: space-between;
    }
    .menu-card:active { transform: scale(0.96); }
    .menu-card.selected { border-color: #10b981; background: rgba(16, 185, 129, 0.14); }
    .emoji { font-size: 1.9rem; margin-bottom: 4px; }
    .name { font-size: 0.78rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; line-height: 1.3; }
    .price { font-size: 0.72rem; color: #94a3b8; font-weight: 600; }

    .qty-badge {
      position: absolute; top: -7px; right: -7px; background: #10b981; color: #052e16;
      border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center;
      justify-content: center; font-weight: 900; font-size: 0.85rem; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .minus-btn {
      position: absolute; top: -7px; left: -7px; background: #e11d48; color: #fff;
      border: none; border-radius: 50%; width: 24px; height: 24px; font-weight: 900;
      font-size: 1rem; line-height: 1; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* پنل چسبان پایین صفحه (مناسب کار با یک دست در موبایل) */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1e293b; border-top: 2px solid #334155;
      padding: 12px 14px; display: flex; flex-direction: column; align-items: center;
      z-index: 20; box-shadow: 0 -8px 25px rgba(0,0,0,0.5);
    }
    .bottom-inner { width: 100%; max-width: 480px; }
    .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .total-label { font-size: 0.88rem; color: #94a3b8; font-weight: 700; }
    .total-val { font-size: 1.35rem; font-weight: 900; color: #38bdf8; }
    .btn-row { display: grid; grid-template-columns: 3fr 1fr; gap: 8px; }
    .btn-submit { background: #10b981; color: #fff; border: none; border-radius: 12px; padding: 13px; font-size: 0.95rem; font-weight: 900; cursor: pointer; }
    .btn-submit:active { transform: scale(0.97); }
    .btn-clear { background: #334155; color: #fb7185; border: none; border-radius: 12px; padding: 13px; font-size: 0.85rem; font-weight: 800; cursor: pointer; }

    /* مودال نمایش شماره فیش */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
    }
    .modal-bg.show { display: flex; }
    .modal-card { background: #1e293b; border: 2px solid #10b981; border-radius: 20px; padding: 24px; width: 100%; max-width: 340px; text-align: center; }
    .token-num { font-size: 4rem; font-weight: 900; color: #10b981; margin: 10px 0; }
    .btn-close-modal { background: #38bdf8; color: #0f172a; border: none; width: 100%; padding: 12px; border-radius: 12px; font-size: 1rem; font-weight: 900; margin-top: 14px; cursor: pointer; }

    .status-toast { text-align: center; font-size: 0.85rem; margin-bottom: 8px; font-weight: 700; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>☕ ثبت سفارش کافه و رستوران</h1>
    </header>

    <input type="text" id="menuSearch" class="search-input" placeholder="🔍 جستجو در منو..." oninput="renderMenu()">

    <div class="section-title">☕ منوی کافه و نوشیدنی</div>
    <div id="grid-cafe" class="menu-grid"></div>

    <div class="section-title">🍔 منوی غذای گرم و رستوران</div>
    <div id="grid-rest" class="menu-grid"></div>
  </div>

  <!-- نوار ثابت پایین صفحه -->
  <div class="bottom-bar">
    <div class="bottom-inner">
      <div id="status-toast" class="status-toast"></div>
      <div class="total-row">
        <span class="total-label">جمع کل سفارش:</span>
        <span class="total-val"><span id="liveTotal">۰</span> <small style="font-size:0.75rem; color:#94a3b8;">تومان</small></span>
      </div>
      <div class="btn-row">
        <button class="btn-submit" onclick="sendOrder()">🧾 ثبت و ارسال به آشپزخانه</button>
        <button class="btn-clear" onclick="clearOrder()">🗑️ پاک</button>
      </div>
    </div>
  </div>

  <!-- پنجره تایید و شماره فیش -->
  <div class="modal-bg" id="tokenModal">
    <div class="modal-card">
      <div style="color:#94a3b8; font-size:0.9rem;">سفارش در آشپزخانه ثبت شد</div>
      <div class="token-num" id="tokenDisplay">-</div>
      <div style="color:#e2e8f0; font-size:0.9rem; font-weight:700;">شماره فیش را به مشتری اعلام کنید</div>
      <button class="btn-close-modal" onclick="closeModal()">سفارش بعدی</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBNC5rFJG7DeHx_Bldy6-xZUkzFalIAempsOuEMs_z56d1QJZOM-y04JxI9BF--0e1/exec";

    const menuItems = [
      { id: 'c1', type: 'cafe', name: 'اسپرسو', emoji: '☕', price: 35000 },
      { id: 'c2', type: 'cafe', name: 'هات چاکلت', emoji: '🍫', price: 45000 },
      { id: 'c3', type: 'cafe', name: 'چای لیوانی', emoji: '🍵', price: 15000 },
      { id: 'c4', type: 'cafe', name: 'آبمیوه طبیعی', emoji: '🍹', price: 40000 },
      { id: 'c5', type: 'cafe', name: 'کیک شکلاتی', emoji: '🍰', price: 30000 },
      { id: 'c6', type: 'cafe', name: 'کیک هویج', emoji: '🥕', price: 25000 },
      { id: 'r1', type: 'rest', name: 'اسنک گوشت', emoji: '🥪', price: 65000 },
      { id: 'r2', type: 'rest', name: 'اسنک مرغ', emoji: '🌮', price: 55000 },
      { id: 'r3', type: 'rest', name: 'سیب‌زمینی', emoji: '🍟', price: 40000 },
      { id: 'r4', type: 'rest', name: 'پاستا', emoji: '🍝', price: 95000 }
    ];

    let cart = {};
    const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    function toPersian(v) { return v.toString().replace(/\d/g, x => farsiDigits[x]); }

    function renderMenu() {
      const q = document.getElementById('menuSearch').value.trim();
      let cHtml = '', rHtml = '', total = 0;

      menuItems.forEach(item => {
        const qty = cart[item.id] || 0;
        total += qty * item.price;

        if (!q || item.name.includes(q)) {
          const sel = qty > 0 ? 'selected' : '';
          const badge = qty > 0 ? `<div class="qty-badge">${toPersian(qty)}</div>` : '';
          const minus = qty > 0 ? `<button class="minus-btn" onclick="event.stopPropagation(); decItem('${item.id}')">−</button>` : '';
          const html = `
            <div class="menu-card ${sel}" onclick="incItem('${item.id}')">
              ${badge}${minus}
              <div class="emoji">${item.emoji}</div>
              <div class="name">${item.name}</div>
              <div class="price">${toPersian(item.price.toLocaleString('en-US'))}</div>
            </div>`;
          if (item.type === 'cafe') cHtml += html; else rHtml += html;
        }
      });

      document.getElementById('grid-cafe').innerHTML = cHtml;
      document.getElementById('grid-rest').innerHTML = rHtml;
      document.getElementById('liveTotal').innerText = toPersian(total.toLocaleString('en-US'));
    }

    function incItem(id) { cart[id] = (cart[id] || 0) + 1; renderMenu(); }
    function decItem(id) {
      if (cart[id] > 1) cart[id]--; else delete cart[id];
      renderMenu();
    }
    function clearOrder() { cart = {}; renderMenu(); showToast('', ''); }

    function showToast(msg, color) {
      const t = document.getElementById('status-toast');
      if (!msg) { t.style.display = 'none'; return; }
      t.style.display = 'block'; t.style.color = color; t.innerText = msg;
    }

    function sendOrder() {
      let total = 0, parts = [];
      for (let id in cart) {
        const item = menuItems.find(m => m.id === id);
        if (item && cart[id] > 0) {
          total += cart[id] * item.price;
          parts.push(`${toPersian(cart[id])} عدد ${item.name}`);
        }
      }
      if (parts.length === 0) { showToast('⚠️ حداقل یک آیتم انتخاب کنید!', '#fb7185'); return; }

      const detail = parts.join('، ') + ` (مجموع: ${toPersian(total.toLocaleString('en-US'))} تومان)`;
      showToast('⏳ در حال ارسال به آشپزخانه...', '#fbbf24');

      const old = document.getElementById('cafe-script');
      if (old) old.remove();
      const s = document.createElement('script');
      s.id = 'cafe-script';
      s.src = SCRIPT_URL + '?action=cafe_order&detail=' + encodeURIComponent(detail) + '&callback=onOrderSuccess&t=' + Date.now();
      document.body.appendChild(s);
    }

    window.onOrderSuccess = function(res) {
      showToast('', '');
      document.getElementById('tokenDisplay').innerText = toPersian(res.orderNum);
      document.getElementById('tokenModal').classList.add('show');
      cart = {};
      renderMenu();
    };

    function closeModal() {
      document.getElementById('tokenModal').classList.remove('show');
    }

    renderMenu();
  </script>
</body>
</html>
