<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل جامع اپراتورهای جشنواره</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .card { width: 100%; max-width: 450px; background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2 { text-align: center; color: #38bdf8; font-size: 1.25rem; margin-bottom: 14px; font-weight: 800; }
    #reader { border-radius: 12px; overflow: hidden; border: 2px dashed #475569; margin-bottom: 14px; background: #0b0f19; }
    
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; }
    input, select { width: 100%; padding: 11px; border-radius: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; font-size: 1.05rem; font-weight: bold; margin-bottom: 12px; outline: none; }
    input:focus, select:focus { border-color: #38bdf8; }
    
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #0f172a; padding: 4px; border-radius: 12px; margin-bottom: 16px; }
    .tab-btn { background: transparent; border: none; color: #94a3b8; font-size: 0.75rem; font-weight: 700; padding: 8px 4px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: 900; }

    .section-panel { display: none; }
    .section-panel.active { display: block; }

    .btn-grid { display: grid; gap: 8px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }

    button.action-btn { border: none; border-radius: 10px; padding: 12px 6px; font-weight: 700; cursor: pointer; color: #fff; font-size: 0.85rem; transition: 0.15s; }
    button.action-btn:active { transform: scale(0.97); }

    .btn-gate-in { background: #2563eb; }
    .btn-gate-out { background: #e11d48; }
    .btn-game-win { background: #d97706; }
    .btn-game-play { background: #475569; }
    .btn-game-special { background: #9333ea; }
    .btn-food { background: #059669; }
    .btn-booth { background: #0284c7; }

    .status { text-align: center; font-size: 0.88rem; margin-top: 14px; padding: 10px; border-radius: 8px; font-weight: 600; min-height: 40px; }
    .success { background: rgba(52, 211, 153, 0.15); color: #34d399; }
    .error { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
    .loading { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎪 پنل ثبت اطلاعات جشنواره</h2>

    <div id="reader"></div>

    <label>کد شرکت‌کننده:</label>
    <input id="userId" type="number" placeholder="کد ۳ رقمی (مثلاً ۱۰۱)">

    <!-- منوی انتخاب بخش -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('gate')">🚪 گیت</button>
      <button class="tab-btn" onclick="switchTab('game')">🎮 بازی</button>
      <button class="tab-btn" onclick="switchTab('food')">☕ کافه</button>
      <button class="tab-btn" onclick="switchTab('booth')">🛍️ غرفه</button>
    </div>

    <!-- ۱. پنل گیت تردد -->
    <div id="panel-gate" class="section-panel active">
      <div class="btn-grid grid-2">
        <button onclick="sendAction('GATE', 'ورود به جشنواره', 0)" class="action-btn btn-gate-in">🟢 ثبت ورود</button>
        <button onclick="sendAction('GATE', 'خروج از جشنواره', 0)" class="action-btn btn-gate-out">🔴 ثبت خروج</button>
      </div>
    </div>

    <!-- ۲. پنل سوله بازی -->
    <div id="panel-game" class="section-panel">
      <label>انتخاب بازی:</label>
      <select id="gameDetail">
        <option value="فیفا / فوتبال دیجیتال">فیفا / فوتبال دیجیتال</option>
        <option value="بردگیم و فکری">بردگیم و بازی فکری</option>
        <option value="چالش واقعیت مجازی VR">چالش واقعیت مجازی VR</option>
        <option value="مسابقه تیراندازی / دارت">مسابقه تیراندازی / دارت</option>
      </select>
      <div class="btn-grid grid-3">
        <button onclick="sendAction('GAME_SCORE', document.getElementById('gameDetail').value + ' (برد)', 10)" class="action-btn btn-game-win">+۱۰ برد</button>
        <button onclick="sendAction('GAME_SCORE', document.getElementById('gameDetail').value + ' (شرکت)', 5)" class="action-btn btn-game-play">+۵ شرکت</button>
        <button onclick="sendAction('GAME_SCORE', document.getElementById('gameDetail').value + ' (ویژه)', 20)" class="action-btn btn-game-special">+۲۰ چالش</button>
      </div>
    </div>

    <!-- ۳. پنل کافه و رستوران -->
    <div id="panel-food" class="section-panel">
      <label>سفارش کافه / غذا:</label>
      <select id="foodDetail">
        <option value="کافه - نوشیدنی گرم / قهوه">☕ نوشیدنی گرم / قهوه</option>
        <option value="کافه - نوشیدنی سرد / آبمیوه">🧃 نوشیدنی سرد / آبمیوه</option>
        <option value="کافه - کیک و شیرینی">🍩 کیک و شیرینی</option>
        <option value="رستوران - وعده ناهار / ساندویچ">🥪 وعده اصلی / ناهار</option>
      </select>
      <div class="btn-grid">
        <button onclick="sendAction('FOOD', document.getElementById('foodDetail').value, 1)" class="action-btn btn-food">☕ ثبت سفارش کافه/غذا</button>
      </div>
    </div>

    <!-- ۴. پنل غرفه‌ها -->
    <div id="panel-booth" class="section-panel">
      <label>انتخاب غرفه:</label>
      <select id="boothDetail">
        <option value="غرفه ۱ - دست‌سازه‌ها و هنر">غرفه ۱ - دست‌سازه‌ها و هنر</option>
        <option value="غرفه ۲ - کتاب و محصولات فرهنگی">غرفه ۲ - کتاب و فرهنگی</option>
        <option value="غرفه ۳ - صنایع‌دستی خیریه">غرفه ۳ - صنایع‌دستی خیریه</option>
        <option value="غرفه ۴ - گل و گیاه">غرفه ۴ - گل و گیاه</option>
      </select>
      <div class="btn-grid">
        <button onclick="sendAction('BOOTH', document.getElementById('boothDetail').value, 1)" class="action-btn btn-booth">🛍️ ثبت خرید / تعامل غرفه</button>
      </div>
    </div>

    <div id="status" class="status" style="display: none;"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYyLX4mA-v5YD78f4qWhJeCmlYI2P2QpWHvSpH3pT8cSy6G5elsb9NwEp2iljK4EA/exec";

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    }

    function onScanSuccess(decodedText) {
      document.getElementById('userId').value = decodedText;
      showStatus('کد ' + decodedText + ' با موفقیت اسکن شد!', 'success');
    }

    try {
      var scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } });
      scanner.render(onScanSuccess);
    } catch(e) {}

    function showStatus(msg, type) {
      var s = document.getElementById('status');
      s.style.display = 'block';
      s.className = 'status ' + type;
      s.innerText = msg;
    }

    function sendAction(type, detail, value) {
      var uid = document.getElementById('userId').value;
      if (!uid) {
        showStatus('لطفاً ابتدا کد شرکت‌کننده را وارد یا اسکن کنید!', 'error');
        return;
      }

      showStatus('در حال ثبت در دیتابیس...', 'loading');

      var finalUrl = SCRIPT_URL + 
        '?userId=' + encodeURIComponent(uid) + 
        '&type=' + encodeURIComponent(type) + 
        '&detail=' + encodeURIComponent(detail) + 
        '&value=' + encodeURIComponent(value) + 
        '&callback=afterSend&t=' + Date.now();

      var old = document.getElementById('action-script');
      if (old) old.remove();

      var s = document.createElement('script');
      s.id = 'action-script';
      s.src = finalUrl;
      s.onload = function() {
        showStatus('✅ با موفقیت ثبت شد: ' + detail, 'success');
      };
      s.onerror = function() {
        showStatus('✅ اطلاعات ثبت شد.', 'success');
      };
      document.body.appendChild(s);
    }

    window.afterSend = function(res) {
      showStatus('✅ تأیید ثبت از سرور دریافت شد', 'success');
    };
  </script>
</body>
</html>
