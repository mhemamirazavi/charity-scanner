<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>پنل صندوق و بازی جشنواره</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; padding: 12px; display: flex; flex-direction: column; align-items: center; }
    .app-container { width: 100%; max-width: 460px; background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); }
    
    h2 { text-align: center; color: #38bdf8; font-size: 1.15rem; margin-bottom: 14px; font-weight: 900; }

    /* تب‌ها */
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #0f172a; padding: 5px; border-radius: 14px; margin-bottom: 14px; }
    .tab-btn { background: transparent; border: none; color: #94a3b8; font-size: 0.9rem; font-weight: 700; padding: 11px 8px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: 900; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }

    /* کادر ثابت اسکنر (بدون دفورمه شدن) */
    .scanner-box {
      position: relative;
      width: 100%;
      height: 230px;
      background: #090d16;
      border: 2px solid #334155;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .scanner-box.scan-success-flash {
      border-color: #10b981 !important;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.65) !important;
    }
    #reader-video { width: 100%; height: 100%; }
    #reader-video video { width: 100% !important; height: 230px !important; object-fit: cover !important; border-radius: 14px; }
    
    .camera-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: #090d16; z-index: 5; padding: 16px; text-align: center;
    }
    .cam-icon { font-size: 2.4rem; opacity: 0.85; }
    .btn-start-cam {
      background: #0284c7; color: #fff; border: none; padding: 12px 22px;
      border-radius: 12px; font-size: 0.9rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); transition: 0.15s;
    }
    .btn-start-cam:active { transform: scale(0.96); }

    /* افکت تایید روی تصویر دوربین */
    .scan-overlay {
      position: absolute; inset: 0; background: rgba(16, 185, 129, 0.28);
      backdrop-filter: blur(2px); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 10; pointer-events: none;
    }
    .scan-overlay.show { display: flex; animation: popFade 0.3s ease; }
    .scan-badge { background: #10b981; color: #052e16; font-weight: 900; padding: 8px 18px; border-radius: 99px; font-size: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    @keyframes popFade { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    .cam-controls { display: none; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .cam-controls.active { display: grid; }
    .btn-cam-ctrl { background: #334155; color: #e2e8f0; border: none; padding: 8px; border-radius: 10px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .btn-cam-stop { background: #9f1239; color: #fff; }

    /* فیلدها */
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
    input {
      width: 100%; padding: 12px; border-radius: 12px; background: #0f172a;
      border: 1.5px solid #475569; color: #fff; font-size: 1.1rem; font-weight: 800;
      text-align: center; margin-bottom: 12px; outline: none; transition: 0.2s;
    }
    input:focus { border-color: #38bdf8; }

    .section-panel { display: none; }
    .section-panel.active { display: block; }

    /* مبالغ آماده صندوق */
    .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .btn-quick { background: #0f172a; border: 1px solid #334155; color: #38bdf8; padding: 8px 4px; border-radius: 9px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .btn-quick:active { background: #38bdf8; color: #0f172a; }

    /* کارت‌های بازی */
    .game-group-title { font-size: 0.85rem; color: #38bdf8; font-weight: 800; margin: 12px 0 8px; padding-bottom: 4px; border-bottom: 1px dashed #334155; }
    .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .game-card {
      background: #0f172a; border: 1.5px solid #334155; border-radius: 12px;
      padding: 10px 8px; text-align: center; cursor: pointer; transition: 0.15s;
      display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
    }
    .game-card.selected { border-color: #10b981; background: rgba(16, 185, 129, 0.14); box-shadow: 0 0 12px rgba(16, 185, 129, 0.2); }
    .game-title { font-size: 0.82rem; font-weight: 800; color: #f1f5f9; }
    .game-sub { font-size: 0.68rem; color: #94a3b8; }
    .game-price { font-size: 0.78rem; font-weight: 800; color: #fbbf24; margin-top: 2px; }
    .score-tag { display: inline-block; background: rgba(147, 51, 234, 0.25); color: #d8b4fe; font-size: 0.65rem; padding: 2px 6px; border-radius: 6px; margin-top: 2px; font-weight: 700; }

    .selected-game-box { background: #0f172a; border: 1px solid #334155; border-radius: 14px; padding: 12px; margin-top: 12px; }
    .score-section { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #334155; display: none; }
    .score-section.show { display: block; }

    /* دکمه‌های عملیاتی */
    button.action-btn { border: none; border-radius: 12px; padding: 13px 10px; font-weight: 800; cursor: pointer; color: #fff; font-size: 0.92rem; transition: 0.15s; width: 100%; }
    button.action-btn:active { transform: scale(0.97); }
    .btn-green { background: #10b981; }
    .btn-blue { background: #0284c7; }
    .btn-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
    .btn-score-5 { background: #475569; font-size: 0.82rem !important; padding: 10px 4px !important; }
    .btn-score-10 { background: #d97706; font-size: 0.82rem !important; padding: 10px 4px !important; }
    .btn-score-20 { background: #9333ea; font-size: 0.82rem !important; padding: 10px 4px !important; }

    .status { text-align: center; font-size: 0.88rem; margin-top: 12px; padding: 10px; border-radius: 10px; font-weight: 700; display: none; line-height: 1.5; }
    .success { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .error { background: rgba(244, 63, 94, 0.18); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }
    .loading { background: rgba(251, 191, 36, 0.18); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
  </style>
</head>
<body>

  <div class="app-container">
    <h2>🎪 پنل صندوق و سوله بازی</h2>

    <!-- تب‌های اصلی -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('bank', this)">💳 صندوق (شارژ)</button>
      <button class="tab-btn" onclick="switchTab('game', this)">🎮 سوله بازی</button>
    </div>

    <!-- اسکنر اختصاصی با کادر ثابت -->
    <div class="scanner-box" id="scanner-box">
      <div id="reader-video"></div>
      <div class="camera-placeholder" id="camera-placeholder">
        <div class="cam-icon">📷</div>
        <button class="btn-start-cam" onclick="startCamera()">روشن کردن دوربین اسکنر</button>
      </div>
      <div class="scan-overlay" id="scan-overlay">
        <div class="scan-badge" id="scan-badge-text">✅ اسکن شد</div>
      </div>
    </div>

    <div class="cam-controls" id="cam-controls">
      <button class="btn-cam-ctrl" onclick="toggleCameraFacing()">🔄 تغییر دوربین</button>
      <button class="btn-cam-ctrl btn-cam-stop" onclick="stopCamera()">⏹ خاموش کردن دوربین</button>
    </div>

    <label>کد شرکت‌کننده (اسکن یا تایپ):</label>
    <input id="userId" type="text" inputmode="numeric" oninput="formatPersianNumber(this)" placeholder="مثلاً: ۱۰۱">

    <!-- ۱. پنل صندوق -->
    <div id="panel-bank" class="section-panel active">
      <label>مبلغ پرداختی روی پوز (تومان):</label>
      <input id="chargeAmount" type="text" inputmode="numeric" oninput="formatCurrency(this)" placeholder="مثلاً: ۱۰۰,۰۰۰">
      
      <div class="quick-amounts">
        <button class="btn-quick" onclick="setQuickAmount(100000)">۱۰۰ هزار</button>
        <button class="btn-quick" onclick="setQuickAmount(200000)">۲۰۰ هزار</button>
        <button class="btn-quick" onclick="setQuickAmount(300000)">۳۰۰ هزار</button>
        <button class="btn-quick" onclick="setQuickAmount(500000)">۵۰۰ هزار</button>
      </div>

      <button onclick="sendBankCharge()" class="action-btn btn-green">💳 شارژ و افزایش موجودی کارت</button>
    </div>

    <!-- ۲. پنل سوله بازی -->
    <div id="panel-game" class="section-panel">
      <div class="game-group-title">🎡 شهربازی ۱</div>
      <div class="game-grid" id="grid-group-1"></div>

      <div class="game-group-title">🕹️ سایر بازی‌ها و خدمات</div>
      <div class="game-grid" id="grid-group-2"></div>

      <div class="selected-game-box" id="selected-game-box">
        <div style="text-align:center; color:#94a3b8; font-size:0.85rem;">یک بازی را از لیست بالا انتخاب کنید</div>
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBNC5rFJG7DeHx_Bldy6-xZUkzFalIAempsOuEMs_z56d1QJZOM-y04JxI9BF--0e1/exec";

    // تعریف لیست دقیق بازی‌ها و خدمات
    const gamesList = [
      // شهربازی ۱
      { id: 'g1', group: 1, name: 'مهد کودک', sub: 'نیم ساعت', price: 250000, hasScore: false, emoji: '🧸' },
      { id: 'g2', group: 1, name: 'گیم نت', sub: '۲۰ دقیقه', price: 100000, hasScore: true, emoji: '🎮' },
      { id: 'g3', group: 1, name: 'تورنومنت گیم نت', sub: 'ورودی مسابقه', price: 180000, hasScore: false, emoji: '🏆' },
      // سایر بخش‌ها
      { id: 'g4', group: 2, name: 'ایرهاکی', sub: 'هر دست', price: 90000, hasScore: true, emoji: '🏒' },
      { id: 'g5', group: 2, name: 'تفنگ ژله‌ای', sub: '۲۰ تیر', price: 110000, hasScore: true, emoji: '🔫' },
      { id: 'g6', group: 2, name: 'عینک VR', sub: 'واقعیت مجازی', price: 70000, hasScore: false, emoji: '🥽' },
      { id: 'g7', group: 2, name: 'گریم صورت', sub: 'کودک و نوجوان', price: 210000, hasScore: false, emoji: '🎨' },
      { id: 'g8', group: 2, name: 'عکاسی هوش مصنوعی', sub: 'تا ۵ فایل (خانواده)', price: 150000, hasScore: false, emoji: '📸' }
    ];

    let selectedGame = null;
    let html5QrCode = null;
    let isCameraRunning = false;
    let currentFacing = "environment"; // دوربین پشت به صورت پیش‌فرض
    let scanCooldown = false;
    let audioCtx = null;

    // توابع تبدیل اعداد
    const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    function toPersian(val) { return val.toString().replace(/\d/g, x => farsiDigits[x]); }
    function toEnglish(str) {
      const p = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
      let r = str.toString(); for (let i = 0; i < 10; i++) r = r.replace(p[i], i); return r;
    }
    function formatCurrency(input) {
      let val = toEnglish(input.value).replace(/\D/g, '');
      input.value = val ? toPersian(Number(val).toLocaleString('en-US')) : '';
    }
    function formatPersianNumber(input) {
      input.value = toPersian(toEnglish(input.value).replace(/\D/g, ''));
    }
    function setQuickAmount(num) {
      document.getElementById('chargeAmount').value = toPersian(num.toLocaleString('en-US'));
    }

    // صدای بوق تایید بدون نیاز به فایل صوتی خارجی
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep() {
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
      } catch (e) {}
    }

    // کنترل دوربین اختصاصی
    async function startCamera() {
      initAudio(); // آزاد کردن صدا در گوشی‌های آیفون و اندروید
      document.getElementById('camera-placeholder').style.display = 'none';
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader-video");

      try {
        await html5QrCode.start(
          { facingMode: currentFacing },
          { fps: 12, qrbox: { width: 170, height: 170 } },
          onScanSuccess
        );
        isCameraRunning = true;
        document.getElementById('cam-controls').classList.add('active');
      } catch (err) {
        document.getElementById('camera-placeholder').style.display = 'flex';
        showStatus('❌ دسترسی به دوربین داده نشد یا مرورگر پشتیبانی نمی‌کند.', 'error');
      }
    }

    async function stopCamera() {
      if (html5QrCode && isCameraRunning) {
        await html5QrCode.stop();
        isCameraRunning = false;
      }
      document.getElementById('cam-controls').classList.remove('active');
      document.getElementById('camera-placeholder').style.display = 'flex';
    }

    async function toggleCameraFacing() {
      currentFacing = (currentFacing === "environment") ? "user" : "environment";
      if (isCameraRunning) {
        await stopCamera();
        startCamera();
      }
    }

    function onScanSuccess(decodedText) {
      if (scanCooldown) return;
      scanCooldown = true;

      const cleanCode = toEnglish(decodedText).replace(/\D/g, '') || decodedText;
      document.getElementById('userId').value = toPersian(cleanCode);

      // پخش صدا، ویبره و افکت بصری
      playBeep();
      if (navigator.vibrate) navigator.vibrate(120);

      const box = document.getElementById('scanner-box');
      const overlay = document.getElementById('scan-overlay');
      document.getElementById('scan-badge-text').innerText = '✅ کد ' + toPersian(cleanCode) + ' اسکن شد';
      
      box.classList.add('scan-success-flash');
      overlay.classList.add('show');
      showStatus('✅ کد ' + cleanCode + ' شناسایی شد.', 'success');

      setTimeout(() => {
        box.classList.remove('scan-success-flash');
        overlay.classList.remove('show');
      }, 900);

      setTimeout(() => { scanCooldown = false; }, 2000);
    }

    // سوییچ تب‌ها
    function switchTab(tab, btnEl) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
      btnEl.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
      document.getElementById('status').style.display = 'none';
    }

    // رندر لیست بازی‌ها
    function renderGames() {
      let g1 = '', g2 = '';
      gamesList.forEach(g => {
        const isSel = selectedGame && selectedGame.id === g.id ? 'selected' : '';
        const scoreBadge = g.hasScore ? `<div class="score-tag">🏅 امتیازی</div>` : '';
        const card = `
          <div class="game-card ${isSel}" onclick="selectGame('${g.id}')">
            <div>
              <div class="game-title">${g.emoji} ${g.name}</div>
              <div class="game-sub">${g.sub}</div>
              ${scoreBadge}
            </div>
            <div class="game-price">${toPersian(g.price.toLocaleString('en-US'))} تومان</div>
          </div>`;
        if (g.group === 1) g1 += card; else g2 += card;
      });
      document.getElementById('grid-group-1').innerHTML = g1;
      document.getElementById('grid-group-2').innerHTML = g2;
    }

    function selectGame(id) {
      selectedGame = gamesList.find(g => g.id === id);
      renderGames();
      const box = document.getElementById('selected-game-box');
      const priceFa = toPersian(selectedGame.price.toLocaleString('en-US'));
      
      let scoreHTML = '';
      if (selectedGame.hasScore) {
        scoreHTML = `
          <div class="score-section show">
            <label style="text-align:center;">🏅 ثبت امتیاز برای ${selectedGame.name}:</label>
            <div class="btn-grid-3">
              <button onclick="sendGameScore(5, 'شرکت')" class="action-btn btn-score-5">+۵ شرکت</button>
              <button onclick="sendGameScore(10, 'برد')" class="action-btn btn-score-10">+۱۰ برد</button>
              <button onclick="sendGameScore(20, 'ویژه')" class="action-btn btn-score-20">+۲۰ ویژه</button>
            </div>
          </div>`;
      }

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span style="font-weight:800; color:#f1f5f9;">${selectedGame.emoji} ${selectedGame.name}</span>
          <span style="font-weight:900; color:#fbbf24;">${priceFa} تومان</span>
        </div>
        <button onclick="sendGamePayment()" class="action-btn btn-blue">💳 کسر ${priceFa} تومان از اعتبار</button>
        ${scoreHTML}
      `;
    }

    function showStatus(msg, type) {
      let formattedMsg = msg.replace(/\d+/g, m => toPersian(Number(m).toLocaleString('en-US')));
      const s = document.getElementById('status');
      s.style.display = 'block';
      s.className = 'status ' + type;
      s.innerText = formattedMsg;
    }

    function getUserId() {
      const uid = toEnglish(document.getElementById('userId').value).replace(/\D/g, '');
      if (!uid) { showStatus('لطفاً ابتدا کد شرکت‌کننده را اسکن یا وارد کنید!', 'error'); return null; }
      return uid;
    }

    function sendBankCharge() {
      const uid = getUserId(); if (!uid) return;
      const raw = toEnglish(document.getElementById('chargeAmount').value).replace(/\D/g, '');
      const amount = Number(raw);
      if (!amount || amount <= 0) { showStatus('لطفاً مبلغ شارژ را وارد کنید!', 'error'); return; }
      dispatchRequest(uid, 'BANK', 'شارژ حساب در صندوق', 0, amount);
    }

    function sendGamePayment() {
      const uid = getUserId(); if (!uid || !selectedGame) return;
      dispatchRequest(uid, 'GAME', selectedGame.name + ' (' + selectedGame.sub + ')', 0, -selectedGame.price);
    }

    function sendGameScore(points, label) {
      const uid = getUserId(); if (!uid || !selectedGame) return;
      dispatchRequest(uid, 'GAME_SCORE', selectedGame.name + ' (' + label + ')', points, 0);
    }

    function dispatchRequest(uid, type, detail, scoreChange, creditChange) {
      showStatus('در حال ارتباط با سرور...', 'loading');
      const finalUrl = SCRIPT_URL +
        '?userId=' + encodeURIComponent(uid) +
        '&type=' + encodeURIComponent(type) +
        '&detail=' + encodeURIComponent(detail) +
        '&scoreChange=' + encodeURIComponent(scoreChange) +
        '&creditChange=' + encodeURIComponent(creditChange) +
        '&callback=processResponse&t=' + Date.now();

      const old = document.getElementById('action-script');
      if (old) old.remove();
      const s = document.createElement('script');
      s.id = 'action-script';
      s.src = finalUrl;
      document.body.appendChild(s);
    }

    window.processResponse = function(res) {
      if (res.status === 'ERROR') {
        showStatus(res.message, 'error');
      } else {
        playBeep();
        showStatus(res.message, 'success');
        document.getElementById('chargeAmount').value = '';
      }
    };

    renderGames();
  </script>
</body>
</html>
