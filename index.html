<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل اپراتور و صندوق</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .card { width: 100%; max-width: 480px; background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2 { text-align: center; color: #38bdf8; font-size: 1.25rem; margin-bottom: 14px; font-weight: 800; }
    #reader { border-radius: 12px; overflow: hidden; border: 2px dashed #475569; margin-bottom: 14px; background: #0b0f19; }
    
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    input, select { width: 100%; padding: 12px; border-radius: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; font-size: 1.05rem; font-weight: bold; margin-bottom: 15px; outline: none; }
    input:focus, select:focus { border-color: #38bdf8; }
    
    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #0f172a; padding: 4px; border-radius: 12px; margin-bottom: 16px; }
    .tab-btn { background: transparent; border: none; color: #94a3b8; font-size: 0.7rem; font-weight: 700; padding: 8px 2px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: 900; }

    .section-panel { display: none; }
    .section-panel.active { display: block; }
    .price-box { border-right: 3px solid #38bdf8; padding-right: 10px; margin-bottom: 10px; }

    .btn-grid { display: grid; gap: 8px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }

    button.action-btn { border: none; border-radius: 10px; padding: 12px 6px; font-weight: 700; cursor: pointer; color: #fff; font-size: 0.9rem; transition: 0.15s; width: 100%; }
    button.action-btn:active { transform: scale(0.97); }

    .btn-green { background: #10b981; }
    .btn-gate-in { background: #2563eb; }
    .btn-gate-out { background: #e11d48; }
    .btn-game-win { background: #d97706; }
    .btn-game-play { background: #475569; }
    .btn-game-special { background: #9333ea; }
    .btn-game-fee { background: #0ea5e9; margin-top: 5px; }
    .btn-food { background: #059669; padding: 15px; font-size: 1rem; }
    .btn-booth { background: #0284c7; }
    .btn-clear { background: #e11d48; padding: 10px; font-size: 0.8rem; margin-top: 5px;}

    .status { text-align: center; font-size: 0.9rem; margin-top: 14px; padding: 10px; border-radius: 8px; font-weight: 600; min-height: 40px; }
    .success { background: rgba(52, 211, 153, 0.15); color: #34d399; }
    .error { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
    .loading { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

    .token-alert { display: none; background: #059669; color: white; padding: 20px; border-radius: 12px; text-align: center; margin-top: 15px; animation: popIn 0.3s ease; }
    .token-number { font-size: 3rem; font-weight: 900; margin: 10px 0; }
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* CSS منوی کافه */
    .menu-search { background: #0b0f19; border: 1px solid #475569; padding: 10px; border-radius: 8px; color: white; width: 100%; margin-bottom: 15px; text-align: right;}
    .menu-title { font-size: 1rem; color: #38bdf8; border-bottom: 1px dashed #334155; padding-bottom: 5px; margin: 15px 0 10px 0; font-weight: 800;}
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .menu-box { background: #0b0f19; border: 2px solid #334155; border-radius: 12px; padding: 12px 5px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; user-select: none; }
    .menu-box.selected { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
    .menu-emoji { font-size: 1.8rem; margin-bottom: 5px; }
    .menu-name { font-size: 0.75rem; font-weight: 700; color: #e2e8f0; margin-bottom: 5px; }
    .menu-price { font-size: 0.7rem; color: #94a3b8; }
    .qty-badge { position: absolute; top: -8px; right: -8px; background: #e11d48; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}
    .total-calc { display: flex; justify-content: space-between; align-items: center; background: #0b0f19; padding: 15px; border-radius: 12px; border: 1px solid #38bdf8; margin: 15px 0; }
    .total-label { font-weight: bold; color: #94a3b8; }
    .total-value { font-size: 1.4rem; font-weight: 900; color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎪 پنل اپراتور و صندوق جشنواره</h2>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('gate')">🚪 گیت</button>
      <button class="tab-btn" onclick="switchTab('bank')">💳 صندوق</button>
      <button class="tab-btn" onclick="switchTab('game')">🎮 بازی</button>
      <button class="tab-btn" onclick="switchTab('food')">☕ کافه</button>
      <button class="tab-btn" onclick="switchTab('booth')">🛍️ غرفه</button>
    </div>

    <!-- فیلد مشترک اسکنر -->
    <div id="scanner-section">
      <div id="reader"></div>
      <label>کد شرکت‌کننده (کیف پول):</label>
      <input id="userId" type="text" inputmode="numeric" oninput="formatPersianNumber(this)" placeholder="کد را اسکن یا تایپ کنید">
    </div>

    <!-- ۱. گیت -->
    <div id="panel-gate" class="section-panel active">
      <div class="btn-grid grid-2">
        <button onclick="sendRequest('CHECK_IN', 'ورود به جشنواره', 0, null)" class="action-btn btn-gate-in">🟢 ثبت ورود</button>
        <button onclick="sendRequest('CHECK_OUT', 'خروج از جشنواره', 0, null)" class="action-btn btn-gate-out">🔴 ثبت خروج</button>
      </div>
    </div>

    <!-- ۲. صندوق -->
    <div id="panel-bank" class="section-panel">
      <div class="price-box">
        <label>مبلغ پرداختی روی پوز (تومان):</label>
        <input id="chargeAmount" type="text" inputmode="numeric" oninput="formatCurrency(this)" placeholder="مثلاً: ۵۰,۰۰۰">
      </div>
      <button onclick="sendRequest('BANK', 'شارژ حساب در صندوق', 0, 'chargeAmount')" class="action-btn btn-green">💳 افزایش موجودی کارت</button>
    </div>

    <!-- ۳. سوله بازی -->
    <div id="panel-game" class="section-panel">
      <label>انتخاب بازی:</label>
      <select id="gameDetail">
        <option value="فیفا / فوتبال دیجیتال">فیفا / فوتبال دیجیتال</option>
        <option value="بردگیم و فکری">بردگیم و بازی فکری</option>
        <option value="چالش واقعیت مجازی VR">چالش واقعیت مجازی VR</option>
      </select>
      <div class="price-box">
        <label>هزینه ورودی بازی (تومان):</label>
        <input id="gameCost" type="text" inputmode="numeric" oninput="formatCurrency(this)" placeholder="مثلاً: ۱۵,۰۰۰">
        <button onclick="sendRequest('GAME', document.getElementById('gameDetail').value + ' (ورود)', 0, 'gameCost')" class="action-btn btn-game-fee">💳 ثبت و کسر مبلغ (بدون امتیاز)</button>
      </div>
      <label style="margin-top: 15px;">ثبت امتیاز:</label>
      <div class="btn-grid grid-3">
        <button onclick="sendRequest('GAME_SCORE', document.getElementById('gameDetail').value + ' (برد)', 10, null)" class="action-btn btn-game-win">+۱۰ برد</button>
        <button onclick="sendRequest('GAME_SCORE', document.getElementById('gameDetail').value + ' (شرکت)', 5, null)" class="action-btn btn-game-play">+۵ شرکت</button>
        <button onclick="sendRequest('GAME_SCORE', document.getElementById('gameDetail').value + ' (ویژه)', 20, null)" class="action-btn btn-game-special">+۲۰ ویژه</button>
      </div>
    </div>

    <!-- ۴. کافه (مدل Grid با انتخابگر) -->
    <div id="panel-food" class="section-panel">
      <div style="background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px;">
        <input type="text" id="menuSearch" class="menu-search" placeholder="🔍 جستجوی اقلام..." oninput="renderMenuUI()">
        
        <div class="menu-title">☕ منوی نوشیدنی و کافه</div>
        <div id="grid-cafe" class="menu-grid"></div>

        <div class="menu-title">🍔 منوی غذای گرم و رستوران</div>
        <div id="grid-rest" class="menu-grid"></div>

        <div class="total-calc">
          <span class="total-label">مبلغ کل سفارش:</span>
          <span class="total-value"><span id="liveTotal">۰</span> <small style="font-size:0.7rem;color:#94a3b8">تومان</small></span>
        </div>

        <button onclick="sendGridOrder()" class="action-btn btn-food">🧾 ثبت نهایی و چاپ در آشپزخانه</button>
        <button onclick="clearOrder()" class="action-btn btn-clear">🗑️ پاک کردن سبد سفارش</button>
      </div>
      
      <!-- نمایش شماره فیش به صندوق‌دار -->
      <div id="token-alert" class="token-alert">
        <div>سفارش با موفقیت ثبت شد</div>
        <div id="token-display" class="token-number">-</div>
        <div>به مشتری اعلام کنید!</div>
      </div>
    </div>

    <!-- ۵. غرفه‌ها -->
    <div id="panel-booth" class="section-panel">
      <label>کالا یا نام غرفه:</label>
      <input id="boothDetail" type="text" placeholder="مثلاً: خرید صنایع دستی غرفه ۱">
      <div class="price-box">
        <label>مبلغ خرید (تومان):</label>
        <input id="boothCost" type="text" inputmode="numeric" oninput="formatCurrency(this)" placeholder="مثلاً: ۱۲۰,۰۰۰">
      </div>
      <button onclick="sendRequest('BOOTH', document.getElementById('boothDetail').value, 0, 'boothCost')" class="action-btn btn-booth">🛍️ پرداخت خرید غرفه</button>
    </div>

    <div id="status" class="status" style="display: none;"></div>
  </div>

  <script>
    // 🔴 آدرس وب‌اپ گوگل اسکریپت خود را اینجا قرار دهید:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBNC5rFJG7DeHx_Bldy6-xZUkzFalIAempsOuEMs_z56d1QJZOM-y04JxI9BF--0e1/exec";

    // --- توابع کمکی فارسی‌سازی ---
    const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    function toPersianDigits(numStr) { return numStr.toString().replace(/\d/g, x => farsiDigits[x]); }
    function toEnglishDigits(str) {
      const persian = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
      let res = str; for(let i=0; i<10; i++) res = res.replace(persian[i], i); return res;
    }
    function formatCurrency(input) {
      let val = toEnglishDigits(input.value).replace(/\D/g, '');
      if (val) input.value = toPersianDigits(Number(val).toLocaleString('en-US'));
      else input.value = '';
    }
    function formatPersianNumber(input) { input.value = toPersianDigits(toEnglishDigits(input.value).replace(/\D/g, '')); }

    // --- منطق تب‌ها و اسکنر ---
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
      
      // مخفی کردن اسکنر در تب کافه (مدل مستقل پوز)
      if(tab === 'food') {
        document.getElementById('scanner-section').style.display = 'none';
        document.getElementById('status').style.display = 'none';
        document.getElementById('token-alert').style.display = 'none';
        renderMenuUI(); // رسم مجدد منو
      } else {
        document.getElementById('scanner-section').style.display = 'block';
      }
    }

    function onScanSuccess(decodedText) {
      document.getElementById('userId').value = toPersianDigits(decodedText);
      showStatus('کد اسکن شد!', 'success');
    }
    try { var scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } }); scanner.render(onScanSuccess); } catch(e) {}

    function showStatus(msg, type) {
      let formattedMsg = msg.replace(/\d+/g, match => toPersianDigits(Number(match).toLocaleString('en-US')));
      var s = document.getElementById('status');
      s.style.display = 'block'; s.className = 'status ' + type; s.innerText = formattedMsg;
    }

    // ==========================================
    // سیستم جدید منوی گرید (To-Do Style)
    // ==========================================
    const menuItems = [
      { id: 'c1', type: 'cafe', name: 'اسپرسو', emoji: '☕', price: 35000 },
      { id: 'c2', type: 'cafe', name: 'هات چاکلت', emoji: '🍫', price: 45000 },
      { id: 'c3', type: 'cafe', name: 'چای لیوانی', emoji: '🍵', price: 15000 },
      { id: 'c4', type: 'cafe', name: 'آبمیوه طبیعی', emoji: '🍹', price: 40000 },
      { id: 'c5', type: 'cafe', name: 'کیک شکلاتی', emoji: '🍰', price: 30000 },
      { id: 'c6', type: 'cafe', name: 'کیک هویج', emoji: '🥕', price: 25000 },
      { id: 'r1', type: 'rest', name: 'اسنک گوشت', emoji: '🥪', price: 65000 },
      { id: 'r2', type: 'rest', name: 'اسنک مرغ', emoji: '🌮', price: 55000 },
      { id: 'r3', type: 'rest', name: 'سیب‌زمینی', emoji: '🍟', price: 40000 },
      { id: 'r4', type: 'rest', name: 'پاستا', emoji: '🍝', price: 95000 }
    ];

    let currentOrder = {}; // ساختار: { 'c1': 2, 'r2': 1 }

    function renderMenuUI() {
      const searchTerm = document.getElementById('menuSearch').value.trim();
      let cafeHTML = '';
      let restHTML = '';
      let totalAmount = 0;

      menuItems.forEach(item => {
        if(item.name.includes(searchTerm)) {
          let qty = currentOrder[item.id] || 0;
          let cssClass = qty > 0 ? 'menu-box selected' : 'menu-box';
          let badgeHTML = qty > 0 ? `<div class="qty-badge">${toPersianDigits(qty)}</div>` : '';
          
          let html = `
            <div class="${cssClass}" onclick="toggleItem('${item.id}')">
              ${badgeHTML}
              <div class="menu-emoji">${item.emoji}</div>
              <div class="menu-name">${item.name}</div>
              <div class="menu-price">${toPersianDigits(item.price.toLocaleString('en-US'))}</div>
            </div>`;
            
          if(item.type === 'cafe') cafeHTML += html;
          else restHTML += html;

          totalAmount += qty * item.price;
        }
      });

      document.getElementById('grid-cafe').innerHTML = cafeHTML;
      document.getElementById('grid-rest').innerHTML = restHTML;
      document.getElementById('liveTotal').innerText = toPersianDigits(totalAmount.toLocaleString('en-US'));
    }

    function toggleItem(id) {
      // هر بار لمس روی آیتم، یک عدد به تعداد آن اضافه می‌کند
      currentOrder[id] = (currentOrder[id] || 0) + 1;
      renderMenuUI();
    }

    function clearOrder() {
      currentOrder = {};
      renderMenuUI();
      document.getElementById('token-alert').style.display = 'none';
      document.getElementById('status').style.display = 'none';
    }

    function sendGridOrder() {
      let total = 0;
      let orderParts = [];

      for (let id in currentOrder) {
        let qty = currentOrder[id];
        let item = menuItems.find(m => m.id === id);
        total += qty * item.price;
        orderParts.push(`${toPersianDigits(qty)} عدد ${item.name}`);
      }

      if (orderParts.length === 0) {
        showStatus('هیچ آیتمی انتخاب نشده است!', 'error');
        return;
      }

      // تولید متن تمیز برای مانیتور آشپزخانه
      let detailString = orderParts.join('، ') + ` (مجموع: ${toPersianDigits(total.toLocaleString('en-US'))} تومان)`;

      document.getElementById('token-alert').style.display = 'none';
      showStatus('در حال ارسال فیش به آشپزخانه...', 'loading');

      var finalUrl = SCRIPT_URL + '?action=cafe_order&detail=' + encodeURIComponent(detailString) + '&callback=processCafeResponse&t=' + Date.now();
      
      var old = document.getElementById('cafe-script');
      if (old) old.remove();
      var s = document.createElement('script');
      s.id = 'cafe-script'; 
      s.src = finalUrl;
      document.body.appendChild(s);
    }

    window.processCafeResponse = function(res) {
      document.getElementById('status').style.display = 'none';
      var tokenAlert = document.getElementById('token-alert');
      tokenAlert.style.display = 'block';
      document.getElementById('token-display').innerText = toPersianDigits(res.orderNum);
      
      // سبد خرید را برای مشتری بعدی خالی می‌کند
      currentOrder = {};
      renderMenuUI();
    };

    // ==========================================
    // توابع تراکنش‌های عادی (کیف پول و بازی)
    // ==========================================
    function sendRequest(type, detail, scoreChange, costInputId) {
      var uidStr = document.getElementById('userId').value;
      var uid = toEnglishDigits(uidStr);
      if (!uid) { showStatus('لطفاً کد شرکت‌کننده را وارد کنید!', 'error'); return; }

      var creditChange = 0;
      if (costInputId) {
        var rawVal = document.getElementById(costInputId).value;
        var amount = Number(toEnglishDigits(rawVal).replace(/\D/g, ''));
        if (rawVal !== "" && (isNaN(amount) || amount <= 0)) { showStatus('مبلغ نامعتبر است!', 'error'); return; }
        if (rawVal !== "") creditChange = (type === 'BANK') ? amount : -amount;
      }

      showStatus('در حال ثبت...', 'loading');
      var finalUrl = SCRIPT_URL + '?userId=' + encodeURIComponent(uid) + '&type=' + encodeURIComponent(type) + '&detail=' + encodeURIComponent(detail) + '&scoreChange=' + encodeURIComponent(scoreChange) + '&creditChange=' + encodeURIComponent(creditChange) + '&callback=processResponse&t=' + Date.now();
      
      var old = document.getElementById('action-script');
      if (old) old.remove();
      var s = document.createElement('script');
      s.id = 'action-script'; s.src = finalUrl;
      document.body.appendChild(s);
    }

    window.processResponse = function(res) {
      if (res.status === 'ERROR') showStatus(res.message, 'error');
      else {
        showStatus(res.message, 'success');
        document.getElementById('chargeAmount').value = '';
        document.getElementById('gameCost').value = '';
        document.getElementById('boothCost').value = '';
      }
    };
  </script>
</body>
</html>
