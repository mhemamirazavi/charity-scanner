<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لیدربرد زنده جشنواره</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
    body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; }
    .gold { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .silver { background: linear-gradient(135deg, #9ca3af, #6b7280); }
    .bronze { background: linear-gradient(135deg, #b45309, #78350f); }
  </style>
</head>
<body class="text-white min-h-screen p-6 flex flex-col items-center">
  <div class="w-full max-w-3xl">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-black text-amber-400 tracking-wide drop-shadow-md">🏆 جدول امتیازات زنده سوله بازی</h1>
      <p class="text-slate-400 mt-2 text-sm">بروزرسانی خودکار و لحظه‌ای</p>
    </header>

    <div id="board" class="space-y-3">
      <div class="text-center text-slate-500 py-12">در حال بارگذاری امتیازات...</div>
    </div>
  </div>

  <script>
    // آدرس وب‌اپ گوگل شیت خودت را اینجا بگذار:
    const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

    // تابعی که پاسخ شیت را پردازش و رندر می‌کند
    window.renderLeaderboard = function(users) {
      let html = '';
      if (!users || users.length === 0) {
        html = '<div class="text-center text-slate-500 py-12">هنوز امتیازی ثبت نشده است!</div>';
      } else {
        users.forEach((u, idx) => {
          let badge = 'bg-slate-800 text-slate-300';
          let rankIcon = (idx + 1);
          if (idx === 0) { badge = 'gold text-slate-950 font-black shadow-lg shadow-amber-500/20'; rankIcon = '🥇 ۱'; }
          else if (idx === 1) { badge = 'silver text-slate-950 font-black'; rankIcon = '🥈 ۲'; }
          else if (idx === 2) { badge = 'bronze text-white font-black'; rankIcon = '🥉 ۳'; }

          html += `
            <div class="flex items-center justify-between p-4 rounded-xl bg-slate-900 border border-slate-800 shadow-md">
              <div class="flex items-center gap-4">
                <span class="w-12 h-12 flex items-center justify-center rounded-lg text-lg ${badge}">${rankIcon}</span>
                <div>
                  <div class="font-bold text-lg text-slate-100">${u.name}</div>
                  <div class="text-xs text-slate-400">شناسه: #${u.id}</div>
                </div>
              </div>
              <div class="text-2xl font-black text-amber-400">${u.score} <span class="text-xs font-normal text-slate-400">امتیاز</span></div>
            </div>`;
        });
      }
      document.getElementById('board').innerHTML = html;
    };

    function fetchLeaderboard() {
      // حذف اسکریپت قبلی در صورت وجود
      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      // فراخوانی داده‌ها بدون هیچ محدودیت مرورگری (JSONP)
      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = SCRIPT_URL + '?action=get_leaderboard&callback=renderLeaderboard&t=' + new Date().getTime();
      document.body.appendChild(script);
    }

    // لود اولیه
    fetchLeaderboard();
    // بروزرسانی خودکار هر ۵ ثانیه یک‌بار
    setInterval(fetchLeaderboard, 5000);
  </script>
</body>
</html>
