<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لیدربرد زنده رویداد خیریه</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding: 24px; }
    .container { width: 100%; max-width: 760px; }
    header { text-align: center; margin-bottom: 28px; }
    h1 { color: #f59e0b; font-size: 2.2rem; font-weight: 900; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.9rem; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      display: flex; align-items: center; justify-content: space-between;
      background: #111827; border: 1px solid #1f2937; border-radius: 14px;
      padding: 16px 20px; transition: all 0.3s ease;
    }
    .left-side { display: flex; align-items: center; gap: 16px; }
    .rank-badge {
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      border-radius: 10px; font-weight: 900; font-size: 1.1rem; background: #1e293b; color: #cbd5e1;
    }
    .rank-1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
    .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #000; }
    .rank-3 { background: linear-gradient(135deg, #b45309, #78350f); color: #fff; }
    .name { font-weight: 700; font-size: 1.15rem; color: #f1f5f9; }
    .uid { font-size: 0.8rem; color: #64748b; margin-top: 2px; }
    .score { font-size: 1.6rem; font-weight: 900; color: #f59e0b; }
    .score span { font-size: 0.85rem; font-weight: 400; color: #94a3b8; }
    .loading { text-align: center; color: #64748b; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏆 جدول امتیازات زنده سوله بازی</h1>
      <p>بروزرسانی مستقیم و لحظه‌ای</p>
    </header>

    <div id="board" class="list">
      <div class="loading">در حال فراخوانی داده‌ها از شیت...</div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '1WCahyRCTz6nAbZDBvtEOoDCr-v8mAWJzye5tHtOJ_2c';
    const SHEET_NAME = 'Users';

    // تعریف آبجکت استاندارد گوگل برای دریافت بدون باگ داده‌ها
    window.google = window.google || {};
    google.visualization = google.visualization || {};
    google.visualization.Query = {
      setResponse: function(response) {
        if (!response || !response.table || !response.table.rows) {
          document.getElementById('board').innerHTML = '<div class="loading">اطلاعاتی یافت نشد!</div>';
          return;
        }

        const rows = response.table.rows;
        let users = [];

        rows.forEach(r => {
          if (r.c && r.c[0] && r.c[0].v !== null) {
            const id = r.c[0].v;
            // اگر نام خالی بود، شناسه را نمایش بده
            const name = (r.c[1] && r.c[1].v) ? r.c[1].v : ('شرکت‌کننده ' + id);
            const score = (r.c[2] && r.c[2].v !== null && !isNaN(r.c[2].v)) ? Number(r.c[2].v) : 0;
            users.push({ id, name, score });
          }
        });

        // مرتب‌سازی نزولی بر اساس بیشترین امتیاز
        users.sort((a, b) => b.score - a.score);
        const topUsers = users.slice(0, 10);

        let html = '';
        if (topUsers.length === 0) {
          html = '<div class="loading">هیچ شرکت‌کننده‌ای یافت نشد!</div>';
        } else {
          topUsers.forEach((u, idx) => {
            let badgeClass = '';
            let badgeIcon = (idx + 1);
            if (idx === 0) { badgeClass = 'rank-1'; badgeIcon = '🥇 ۱'; }
            else if (idx === 1) { badgeClass = 'rank-2'; badgeIcon = '🥈 ۲'; }
            else if (idx === 2) { badgeClass = 'rank-3'; badgeIcon = '🥉 ۳'; }

            html += `
              <div class="card">
                <div class="left-side">
                  <div class="rank-badge ${badgeClass}">${badgeIcon}</div>
                  <div>
                    <div class="name">${u.name}</div>
                    <div class="uid">شناسه: #${u.id}</div>
                  </div>
                </div>
                <div class="score">${u.score} <span>امتیاز</span></div>
              </div>
            `;
          });
        }
        document.getElementById('board').innerHTML = html;
      }
    };

    function refreshData() {
      const oldScript = document.getElementById('gviz-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'gviz-script';
      script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${SHEET_NAME}&t=${Date.now()}`;
      document.body.appendChild(script);
    }

    refreshData();
    setInterval(refreshData, 5000);
  </script>
</body>
</html>
